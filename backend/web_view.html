<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Embodiments Viewer</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  #layout { display: grid; grid-template-columns: minmax(280px, 1fr) 2fr; gap: 8px; padding: 8px; height: 100%; }
  #left { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #devices { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    grid-auto-rows: minmax(0, 1fr); gap: 8px; min-height: 0; overflow: auto; align-content: stretch; }
  section, .device { border: 1px solid #fff; padding: 6px 8px; min-height: 0; min-width: 0; }
  h2 { margin: 0 0 4px; font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: .05em; }
  .device { display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .device .info { overflow: auto; flex: 0 1 auto; max-height: 55%; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .label { opacity: .6; }
  pre, .log { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; }
  .log { flex: 1 1 0; min-height: 80px; overflow: auto; border-top: 1px solid #fff; padding-top: 4px; }
  #console-box { flex: 1 1 0; display: flex; flex-direction: column; min-height: 160px; }
  #console { flex: 1 1 0; overflow: auto; }
  label { cursor: pointer; user-select: none; }
  input[type=checkbox] { accent-color: #fff; }
  select, input[type=text] { background: #000; color: #fff; border: 1px solid #fff; font: inherit; padding: 2px 4px; width: 100%; }
  .field { display: grid; grid-template-columns: 90px 1fr; gap: 6px; align-items: center; margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 1px 6px 1px 0; vertical-align: top; }
  th { opacity: .6; font-weight: normal; }
  img { max-width: 100%; max-height: 160px; filter: grayscale(1); display: block; }
  .thinking { opacity: .55; font-style: italic; }
  #conn { float: right; opacity: .6; }
  @media (max-width: 800px) {
    html, body { height: auto; }
    #layout { display: block; height: auto; }
    #left > *, #devices > * { margin-bottom: 8px; }
    #console-box { height: 300px; }
    #devices { display: block; overflow: visible; }
    .device { height: 480px; }
  }
</style>
</head>
<body>
<div id="layout">
  <div id="left">
    <section>
      <h2>Backend <span id="conn">connecting…</span></h2>
      <div id="backend"></div>
      <div id="summary"></div>
    </section>
    <section>
      <h2>Global settings</h2>
      <div class="field"><span class="label">LLM model</span><select id="sel-llm"></select></div>
      <div class="field"><span class="label">STT model</span><select id="sel-stt"></select></div>
      <div class="field"><span class="label">TTS model</span><select id="sel-tts"></select></div>
      <div class="field"><span class="label">Add TTS voice</span>
        <input type="text" id="add-voice" placeholder="e.g. en_GB-alan-low + Enter"></div>
    </section>
    <section>
      <h2>Connected devices</h2>
      <table><thead><tr><th>Session</th><th>Kind</th><th>Status</th></tr></thead><tbody id="sessions"></tbody></table>
    </section>
    <section id="console-box">
      <h2>Global console</h2>
      <div id="console" class="log"></div>
    </section>
  </div>
  <div id="devices"></div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const MAX_LINES = 2000;
const devices = new Map();
let ws;

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  Object.assign(node, props || {});
  node.append(...children);
  return node;
}

function appendLine(container, text, cls) {
  const stick = container.scrollTop + container.clientHeight >= container.scrollHeight - 8;
  container.append(el("div", cls ? { className: cls } : {}, text));
  while (container.childElementCount > MAX_LINES) container.firstChild.remove();
  if (stick) container.scrollTop = container.scrollHeight;
}

function send(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}

function setSelect(select, entry) {
  select.replaceChildren(...entry.options.map((o) => el("option", { value: o, textContent: o })));
  select.value = entry.current;
}

function renderModels(models) {
  for (const key of ["llm", "stt", "tts"]) setSelect($("sel-" + key), models[key]);
}

function renderSessions(sessions) {
  $("sessions").replaceChildren(...Object.entries(sessions).map(([id, s]) => sessionRow(id, s)));
}

function sessionRow(id, s) {
  const tr = el("tr", { id: "session-" + id });
  tr.append(el("td", { textContent: id }), el("td", { textContent: s.kind }), el("td", { textContent: s.status }));
  return tr;
}

function checkbox(label, checked, onChange) {
  const input = el("input", { type: "checkbox", checked });
  input.addEventListener("change", () => onChange(input.checked));
  return { input, node: el("label", {}, input, " " + label) };
}

function renderTools(tools) {
  if (!tools.length) return "Available tools\n(none yet)";
  return "Available tools\n" + tools.map((t) =>
    `${t.name || "unnamed"}(value: ${t.dataType || "string"})\n  ${t.description || "No description."}`).join("\n");
}

function renderNow(d) {
  return `STT: ${d.stt || "(listening...)"}\n\nPrompt: ${d.prompt || "(none yet)"}\n\nResponse: ${d.response || "(none yet)"}`;
}

function addDevice(id, d) {
  if (devices.has(id)) return;
  const refs = { data: d };
  refs.title = el("div", { textContent: d.name || "Device " + id });
  refs.title.style.fontWeight = "bold";
  refs.status = el("div");
  const mic = checkbox("Mute mic", d.mic_muted, (v) => send({ action: "mic", id, value: v }));
  const spk = checkbox("Mute speaker", d.speaker_muted, (v) => send({ action: "speaker", id, value: v }));
  const inLocal = checkbox("Local audio in", d.in_local, (v) => send({ action: "route", id, direction: "in", value: v }));
  const outLocal = checkbox("Local audio out", d.out_local, (v) => send({ action: "route", id, direction: "out", value: v }));
  refs.mic = mic.input; refs.speaker = spk.input; refs.inLocal = inLocal.input; refs.outLocal = outLocal.input;
  refs.tools = el("pre");
  refs.now = el("pre");
  refs.image = el("img", { alt: "" });
  refs.image.hidden = true;
  refs.log = el("div", { className: "log" });
  const prompt = el("input", { type: "text", placeholder: "Prompt for this device + Enter" });
  prompt.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && prompt.value.trim()) {
      send({ action: "prompt", id, text: prompt.value });
      prompt.value = "";
    }
  });
  const info = el("div", { className: "info" },
    refs.title, refs.status,
    el("div", { className: "row" }, inLocal.node, mic.node),
    el("div", { className: "row" }, outLocal.node, spk.node),
    el("h2", { textContent: "Tools" }), refs.tools,
    el("h2", { textContent: "Now" }), refs.now,
    refs.image);
  refs.root = el("div", { className: "device", id: "device-" + id }, info, refs.log, prompt);
  $("devices").append(refs.root);
  devices.set(id, refs);
  refs.status.textContent = `Kind: ${d.kind} | Status: ${d.status}`;
  refs.tools.textContent = renderTools(d.tools);
  refs.now.textContent = renderNow(d);
  if (d.image) setImage(refs, d.image);
  (d.log || []).forEach((line) => appendLog(refs, line));
}

function appendLog(refs, line) {
  appendLine(refs.log, line, line.startsWith("\u{1F916}\u{1F4AD}") ? "thinking" : "");
}

function setImage(refs, b64) {
  refs.image.src = "data:image/jpeg;base64," + b64;
  refs.image.hidden = false;
}

function setField(id, field, value) {
  const refs = devices.get(id);
  if (!refs) return;
  refs.data[field] = value;
  const d = refs.data;
  switch (field) {
    case "name": refs.title.textContent = value || "Device " + id; break;
    case "tools": refs.tools.textContent = renderTools(value); break;
    case "stt": case "prompt": case "response": refs.now.textContent = renderNow(d); break;
    case "mic_muted": refs.mic.checked = value; break;
    case "speaker_muted": refs.speaker.checked = value; break;
    case "in_local": refs.inLocal.checked = value; break;
    case "out_local": refs.outLocal.checked = value; break;
    case "image": if (value) setImage(refs, value); break;
  }
}

function handle(m) {
  switch (m.type) {
    case "snapshot":
      $("backend").textContent = "Backend listening on " + m.backend;
      $("summary").textContent = m.summary;
      renderModels(m.models);
      renderSessions(m.sessions);
      $("console").replaceChildren();
      m.console.forEach((l) => appendLine($("console"), l));
      devices.forEach((r) => r.root.remove());
      devices.clear();
      Object.entries(m.devices).forEach(([id, d]) => addDevice(id, d));
      break;
    case "console": appendLine($("console"), m.text); break;
    case "summary": $("summary").textContent = m.summary; break;
    case "models": renderModels(m.models); break;
    case "session": {
      const row = $("session-" + m.id);
      const fresh = sessionRow(m.id, m);
      row ? row.replaceWith(fresh) : $("sessions").append(fresh);
      const refs = devices.get(m.id);
      if (refs) refs.status.textContent = `Kind: ${m.kind} | Status: ${m.status}`;
      break;
    }
    case "session_removed": $("session-" + m.id)?.remove(); break;
    case "device_added": addDevice(m.id, m.device); break;
    case "device_removed": devices.get(m.id)?.root.remove(); devices.delete(m.id); break;
    case "device_log": { const r = devices.get(m.id); if (r) appendLog(r, m.text); break; }
    case "device_field": setField(m.id, m.field, m.value); break;
  }
}

for (const key of ["llm", "stt", "tts"]) {
  $("sel-" + key).addEventListener("change", (e) => send({ action: "model", kind: key, value: e.target.value }));
}
$("add-voice").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.value.trim()) {
    send({ action: "add_voice", value: e.target.value });
    e.target.value = "";
  }
});

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/viewer/ws");
  ws.onopen = () => { $("conn").textContent = "connected"; };
  ws.onmessage = (e) => handle(JSON.parse(e.data));
  ws.onclose = () => { $("conn").textContent = "reconnecting…"; setTimeout(connect, 1500); };
}
connect();
</script>
</body>
</html>
