# Single source of truth for runtime config. Loaded at startup via
# Python's stdlib tomllib —
# Edit values below and restart the backend to apply.

# Full list of Vosk models can be found here: https://alphacephei.com/vosk/models
# notifyTTS = true  # if enabled, send a notification to the Arduino
# muteMicrophone = true  # optional to turn off microphone input permanently
volume = 50  # 0 to 100

communicationMethod = "WiFi"  # "Serial", "BLE", or "WiFi" (e.g. ArduinoExample/WiFi/M5StackExample)
# serviceUuid = "19b10000-e8f2-537e-4f6c-d104768a1214"  # Only needed for BLE

# Only used when communicationMethod = "WiFi". Each connected device gets its own tools,
# conversation history, and STT session, so they don't interfere with each other.
maxDeviceSessions = 10

# Global text to speech operation flag
ttsEnabled = true

# Global send assistant response text to the WiFi device (for example, its display).
deviceResponseDisplay = true
# Global stream Piper-generated speech to the WiFi device's speaker.
deviceTtsEnabled = true

# Only used to document the device's own bootstrap settings when communicationMethod = "WiFi".
# The device itself needs WiFi + backend URL before it can reach this file, so it keeps its own
# copy (e.g. in Preferences/NVS); this table is reference only and not read by the device.
# [deviceWifi]
# ssid = "YourNetworkName"
# password = "YourNetworkPassword"
# backendUrl = "ws://192.168.1.10:3000/device"

# Saves each conversation as one JSON line in logs/dataset/<device name>/ (git-ignored) for fine-tuning.
# Wizard_of_Oz/server.py writes to the same folders in the same format; combine with `cat logs/dataset/<device>/*.jsonl`.
[dataCollection]
enabled = true

[speech]
# "vosk" - lightweight, CPU-only, streaming partial results. Good default for Raspberry Pi-class devices.
# "whisper" - faster-whisper (CTranslate2). More accurate, supports CUDA GPUs, better for multiple GPUs
# and (in a future version) multiple simultaneous transcription sessions. No streaming partials; it
# transcribes each utterance after a short pause using the same voice-activity detection as "vosk".
sttBackend = "whisper"  # "vosk" | "whisper"
speechToTextModel = "tiny.en"  # Whisper model name (sttBackend = "whisper"); use a Vosk model folder for sttBackend = "vosk"
textToSpeechModel = "en_GB-northern_english_male-medium.onnx"

# Only used when sttBackend = "whisper". Ignored otherwise.
[speech.whisper]
device = "auto"       # "auto" | "cpu" | "cuda" - "auto" falls back to CPU when CUDA is unavailable or incomplete
deviceIndex = 0        # Which GPU to use when device resolves to "cuda" (e.g. 1 for a second card).
# Set this per instance/session once multiple simultaneous transcriptions across several GPUs are supported.
computeType = "auto"  # "auto" | "int8" | "float16" | "float32" - "auto" picks float16 on GPU, int8 on CPU
language = "en"      # "auto" detects the spoken language; set "en" or "de" to skip detection and speed things up
 
# Single STT model name for both languages (multilingual Whisper models like "small" handle en/de
# in the same model). Vosk models are downloaded to backend/STTmodels/; Whisper models are
# downloaded automatically by faster-whisper on first use and cached locally.
#
# Suggested Whisper models (used only when sttBackend = "whisper"):
# - English only, fastest/smallest: "tiny.en", "base.en", "small.en", "medium.en"
# - Multilingual (needed for German, or for English + German with one model): "tiny", "base", "small",
#   "medium", "large-v3". There is no German-only Whisper model, so German requires a multilingual one.
# - Raspberry Pi / CPU-only: "tiny" or "tiny.en" - anything larger will be too slow without a GPU.
# - Single consumer GPU (~6-8 GB VRAM): "small" or "medium" for a good accuracy/speed balance.
# - Higher-end GPU (~10 GB+ VRAM): "large-v3" for the best accuracy.

[llmSettings]
# Many of these settings are overridden by settings on the arduino device itself, which are sent to the backend via a `deviceInfo` message on connect.
provider = "ollama"  # "ollama" for local model on this device, "openai" for cloud API
temperature = 0.9  # Number between -2.0 and 2.0. Positive value decreases the model's likelihood to repeat the same line verbatim.
frequency_penalty = 0.9  # Number between -2.0 and 2.0. Positive values increase the model's likelihood to talk about new topics.
presence_penalty = 0.0  # Number between -2.0 and 2.0. Positive values increase the model's likelihood to generate words and phrases present in the input prompt.
model = "gemma4:e4b"  # default Ollama model; change to another supported model as needed
# Allow deviceInfo to override the configured model until a model is chosen in the TUI.
allowDeviceModelOverride = false
max_tokens = 8192  # Number between 1 and 8192. The maximum number of tokens to generate in the completion.
# Ollama only: reasoning before answering. Restart the backend and reconnect the device after changing it.
# Options: false (off, fastest) | true (on) | "low" | "medium" | "high" (effort levels).
# Gemma 4 (tested with gemma4:e4b) ignores the levels: low/medium/high behave like true. Use false to disable.
think = false
# Most thinking models (e.g. Qwen3, DeepSeek-R1) accept only true/false; models without thinking
# support (e.g. llama3.2) may error, so remove this line for them. max_tokens also limits thinking text.

user_id = "1"  # A unique identifier for the user. Used to track API usage.
url = "http://127.0.0.1:11434/api/chat"  # Ollama chat endpoint

# Stream the reply token by token (Ollama only) so the TUI fills in as the model writes.
# Total generation time is the same; it just starts showing much sooner.
streamResponses = true
# For OpenAI instead, setup the .env file with the key (see readme) and uncomment the following lines:
# provider = "openai"
# model = "gpt-4.1"
# url = "https://api.openai.com/v1/chat/completions"

# Single debug switch for novice users.
# true  -> backend logs raw model request/response data
# false -> normal runtime logs only
debugRawModelOutput = true

# Arch-Function output support.
# Enable this when using Arch-Function models so <tool_call>...</tool_call> messages
# are parsed as real tool calls.
[llmSettings.archFunction]
enabled = false

# Raspberry Pi AI HAT+ auto routing.
# If HAT+ is detected and a URL is set, backend routes LLM calls to this endpoint.
# Use an OpenAI-compatible endpoint backed by your local HAT+ runtime.
[llmSettings.aiHatPlus]
autoDetect = true
preferWhenAvailable = true
provider = "openai"
url = ""

# Output cleanup and recovery for models that blend text and pseudo tool calls,
# e.g. "set_LED(1) Done." in normal assistant text.
[llmSettings.outputSanitizer]
# Remove pseudo calls from displayed/spoken assistant text.
stripPseudoToolCalls = true

# If true, pseudo calls found in assistant text are converted into real function calls.
# Example: "set_LED(1)" -> execute set_LED with value=1.
# Safety: only known configured functions are eligible.
executeInlinePseudoCalls = true

# backend-only test of toolcall.
[functions.tools.watermelon_test]
description = "Test tool call. Call this exactly once when the user says 'watermelon go go'. Set value to the requested number of watermelons, or 3 when no number is requested."
target = "notification"
commType = "read"
dataType = "integer"

[camera]
deviceIndex = 0

[functions.tools.take_picture]
description = "Capture a photo with the built-in camera and inspect it to answer visual questions."
target = "camera"
commType = "read"
dataType = "none"

# Global instructions apply to every device and come before any device-specific persona.
[[conversationProtocol]]
role = "system"
content = "Respond in plain text with normal punctuation. Do not use markdown formatting, asterisks, emojis, or other decorative special symbols in responses."
