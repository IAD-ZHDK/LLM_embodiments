# Single source of truth for runtime config. Loaded at startup via
# Python's stdlib tomllib —
# Edit values below and restart the backend to apply.

# Active language profile used for both STT and TTS.
activeLanguage = "en"  # "en" or "de"

# Full list of Vosk models can be found here: https://alphacephei.com/vosk/models
# notifyTTS = true  # if enabled, send a notification to the Arduino
# muteMicrophone = true  # optional to turn off microphone input permanently
volume = 50  # 0 to 100

communicationMethod = "WiFi"  # "Serial", "BLE", or "WiFi" (e.g. ArduinoExample/WiFi/M5StackExample)
# serviceUuid = "19b10000-e8f2-537e-4f6c-d104768a1214"  # Only needed for BLE

# Only used to document the device's own bootstrap settings when communicationMethod = "WiFi".
# The device itself needs WiFi + backend URL before it can reach this file, so it keeps its own
# copy (e.g. in Preferences/NVS); this table is reference only and not read by the device.
# [deviceWifi]
# ssid = "YourNetworkName"
# password = "YourNetworkPassword"
# backendUrl = "ws://192.168.1.10:3000/device"

[speech]
# Current implementation uses Vosk. "whisper" is reserved for future backend support.
sttBackend = "vosk"  # "vosk" | "whisper"

# Use explicit model names for each language profile. Vosk models are downloaded to backend/STTmodels/ and TTS models to backend/TTSmodels/.  
[speech.languageProfiles.en]
speechToTextModel = "vosk-model-small-en-us-0.15"
textToSpeechModel = "en_GB-alan-low.onnx"

[speech.languageProfiles.de]
speechToTextModel = "vosk-model-small-de-0.15"
textToSpeechModel = "de_DE-thorsten-medium.onnx"

[llmSettings]
# Many of these settings are overridden by settings on the arduino device itself, which are sent to the backend via a `deviceInfo` message on connect.
provider = "ollama"  # "ollama" for local model on this device, "openai" for cloud API
temperature = 0.9  # Number between -2.0 and 2.0. Positive value decreases the model's likelihood to repeat the same line verbatim.
frequency_penalty = 0.9  # Number between -2.0 and 2.0. Positive values increase the model's likelihood to talk about new topics.
presence_penalty = 0.0  # Number between -2.0 and 2.0. Positive values increase the model's likelihood to generate words and phrases present in the input prompt.
model = "llama3.2:3b"  # e.g. llama3.2:3b, deepseek-r1:1.5b (R1 distill), qwen2:7b, qwen2.5:3b, phi3:mini
# For DeepSeek-R1-Distill and Qwen2 support with Ollama, you can set:
# model = "deepseek-r1:1.5b"   # lightweight DeepSeek-R1 distill option
# model = "qwen2:7b"           # Qwen2 family option
# model = "qwen2.5:3b"         # smaller Qwen for Pi-class devices
# model = "qwen3:14b"          # Higher-end Qwen3 family (requires more RAM))
# model = "katanemo/Arch-Function-3B"  # Arch-Function family (typically served via OpenAI-compatible endpoint)
max_tokens = 4096  # Number between 1 and 8192. The maximum number of tokens to generate in the completion.
user_id = "1"  # A unique identifier for the user. Used to track API usage.
url = "http://127.0.0.1:11434/api/chat"  # Ollama chat endpoint
# For OpenAI instead, setup the .env file with the key (see readme) and uncomment the following lines:
# provider = "openai"
# model = "gpt-4.1"
# url = "https://api.openai.com/v1/chat/completions"

# Single debug switch for novice users.
# true  -> backend logs raw model request/response data
# false -> normal runtime logs only
debugRawModelOutput = true

# Arch-Function output support.
# Enable this when using Arch-Function models so <tool_call>...</tool_call> messages
# are parsed as real tool calls.
[llmSettings.archFunction]
enabled = false

# Raspberry Pi AI HAT+ auto routing.
# If HAT+ is detected and a URL is set, backend routes LLM calls to this endpoint.
# Use an OpenAI-compatible endpoint backed by your local HAT+ runtime.
[llmSettings.aiHatPlus]
autoDetect = true
preferWhenAvailable = true
provider = "openai"
url = ""

# Output cleanup and recovery for models that blend text and pseudo tool calls,
# e.g. "set_LED(1) Done." in normal assistant text.
[llmSettings.outputSanitizer]
# Remove pseudo calls from displayed/spoken assistant text.
stripPseudoToolCalls = true

# If true, pseudo calls found in assistant text are converted into real function calls.
# Example: "set_LED(1)" -> execute set_LED with value=1.
# Safety: only known configured functions are eligible.
executeInlinePseudoCalls = true

# Global routing policy only.
# Keep per-tool settings inside functions.tools to avoid duplicate configuration.
[llmSettings.toolPolicy]
enableIntentFilter = true
commandKeywords = [
  "watermelon go go",
  "turn",
  "set",
  "switch",
  "enable",
  "disable",
  "increase",
  "decrease",
  "read",
  "get",
  "start",
  "stop",
]

# Always-present backend-only test tool. It does not require a connected device.
[functions.tools.watermelon_test]
description = "Test tool call. Call this exactly once when the user says 'watermelon go go'. Set value to the requested number of watermelons, or 3 when no number is requested."
target = "notification"
commType = "read"
dataType = "integer"
triggerKeywords = ["watermelon go go"]

# Assistant messages help store prior responses.
[[conversationProtocol]]
role = "system"
content = "You are an annoying, rude assistant with a sharp tongue. Stay in character for every reply. Keep normal chat replies short and direct. Only use tools for explicit device-control or sensor-read commands. When the user says 'watermelon go go', you must call watermelon_test exactly once with an integer value: use the number the user requests, or 3 when they do not provide one. For greetings, identity questions, and general conversation, answer as plain text in character and do NOT output JSON, code fences, or function-call objects."
